<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>영화 티어리스트</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Malgun Gothic", sans-serif;
    background: #1a1a2e;
    color: #eee;
    padding: 16px;
    min-height: 100vh;
  }
  h1 { text-align: center; font-size: 1.5rem; margin-bottom: 16px; }

  .add-box {
    display: flex;
    gap: 8px;
    max-width: 500px;
    margin: 0 auto 12px;
  }
  .add-box input {
    flex: 1;
    padding: 10px 12px;
    border: none;
    border-radius: 8px;
    font-size: 1rem;
  }
  .add-box button {
    padding: 10px 16px;
    border: none;
    border-radius: 8px;
    background: #e94560;
    color: #fff;
    font-size: 1rem;
    cursor: pointer;
  }
  .add-box button:active { opacity: .8; }

  .reset-box {
    text-align: center;
    max-width: 500px;
    margin: 0 auto 20px;
  }
  .reset-box button {
    padding: 6px 14px;
    border: 1px solid #e94560;
    border-radius: 8px;
    background: transparent;
    color: #e94560;
    font-size: 0.85rem;
    cursor: pointer;
  }
  .reset-box button:active { background: rgba(233,69,96,0.15); }

  .tier-row {
    display: flex;
    margin-bottom: 8px;
    border-radius: 8px;
    overflow: hidden;
    min-height: 70px;
  }
  .tier-label {
    flex: 0 0 60px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 1.4rem;
    font-weight: bold;
    color: #333;
  }
  .tier-drop {
    flex: 1;
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
    padding: 8px;
    background: rgba(255,255,255,0.05);
    align-content: flex-start;
  }
  .tier-drop.drag-over { background: rgba(233,69,96,0.2); }

  .label-S { background: #ffb3ba; }
  .label-A { background: #ffdfba; }
  .label-B { background: #ffffba; }
  .label-C { background: #baffc9; }
  .label-D { background: #bae1ff; }
  .label-F { background: #d4baff; }

  .unranked {
    margin-top: 20px;
    border-radius: 8px;
    overflow: hidden;
  }
  .unranked-title {
    background: #0f3460;
    padding: 10px 12px;
    font-weight: bold;
  }
  .unranked .tier-drop { min-height: 80px; }

  .card {
    background: #16213e;
    border: 1px solid #0f3460;
    border-radius: 6px;
    padding: 8px 10px;
    font-size: 0.9rem;
    cursor: grab;
    display: flex;
    align-items: center;
    gap: 6px;
    user-select: none;
    touch-action: none;
  }
  .card.dragging { opacity: 0.4; }
  .card .del {
    color: #e94560;
    font-weight: bold;
    cursor: pointer;
    padding: 0 2px;
  }

  .ghost {
    position: fixed;
    pointer-events: none;
    z-index: 1000;
    opacity: 0.85;
    background: #16213e;
    border: 1px solid #e94560;
    border-radius: 6px;
    padding: 8px 10px;
    font-size: 0.9rem;
    color: #eee;
  }

  @media (max-width: 480px) {
    .tier-label { flex: 0 0 44px; font-size: 1.1rem; }
    .card { font-size: 0.8rem; padding: 6px 8px; }
  }
</style>
</head>
<body>
  <h1>🎬 영화 티어리스트</h1>

  <div class="add-box">
    <input type="text" id="titleInput" placeholder="영화 제목 입력 후 Enter">
    <button id="addBtn">추가</button>
  </div>

  <div class="reset-box">
    <button id="resetBtn">전체 초기화</button>
  </div>

  <div id="tiers"></div>

  <div class="unranked">
    <div class="unranked-title">📦 미분류</div>
    <div class="tier-drop" data-tier="unranked"></div>
  </div>

<script>
  const TIERS = ["S", "A", "B", "C", "D", "F"];
  const SAMPLE = ["기생충","인터스텔라","이터널 선샤인","라라랜드","헤어질 결심",
    "인사이드 아웃 2","탑건: 매버릭","트랜스포머: 사라진 시대","존 오브 인터레스트","퍼펙트 데이즈"];

  let movies = load();

  function load() {
    const saved = localStorage.getItem("tierlist");
    if (saved) return JSON.parse(saved);
    return SAMPLE.map((title, i) => ({ id: Date.now() + i, title, tier: "unranked" }));
  }

  function save() {
    localStorage.setItem("tierlist", JSON.stringify(movies));
  }

  // 티어 행 생성
  const tiersEl = document.getElementById("tiers");
  TIERS.forEach(t => {
    const row = document.createElement("div");
    row.className = "tier-row";
    row.innerHTML = `
      <div class="tier-label label-${t}">${t}</div>
      <div class="tier-drop" data-tier="${t}"></div>`;
    tiersEl.appendChild(row);
  });

  // 카드 렌더링 (등급 내 가나다순 자동 정렬)
  function render() {
    document.querySelectorAll(".tier-drop").forEach(drop => drop.innerHTML = "");
    // 가나다순 정렬해서 그리기
    const sorted = [...movies].sort((a, b) => a.title.localeCompare(b.title, "ko"));
    sorted.forEach(m => {
      const drop = document.querySelector(`.tier-drop[data-tier="${m.tier}"]`);
      if (!drop) return;
      const card = document.createElement("div");
      card.className = "card";
      card.draggable = true;
      card.dataset.id = m.id;
      card.innerHTML = `<span>${m.title}</span><span class="del">×</span>`;
      drop.appendChild(card);
    });
    save();
  }

  // 영화 추가 (중복 제목 차단)
  function addMovie() {
    const input = document.getElementById("titleInput");
    const title = input.value.trim();
    if (!title) return;
    // 중복 체크 (공백 제거 + 대소문자 무시)
    const exists = movies.some(m => m.title.trim().toLowerCase() === title.toLowerCase());
    if (exists) {
      alert("이미 추가된 영화입니다: " + title);
      return;
    }
    movies.push({ id: Date.now(), title, tier: "unranked" });
    input.value = "";
    render();
  }
  document.getElementById("addBtn").addEventListener("click", addMovie);
  document.getElementById("titleInput").addEventListener("keydown", e => {
    if (e.key === "Enter") addMovie();
  });

  // 전체 초기화
  document.getElementById("resetBtn").addEventListener("click", () => {
    if (confirm("모든 데이터를 지우고 예시 10편으로 되돌릴까요?")) {
      localStorage.removeItem("tierlist");
      movies = load();
      render();
    }
  });

  // 삭제 (이벤트 위임)
  document.body.addEventListener("click", e => {
    if (e.target.classList.contains("del")) {
      const id = Number(e.target.closest(".card").dataset.id);
      movies = movies.filter(m => m.id !== id);
      render();
    }
  });

  // 등급 이동 (순서는 자동 정렬이므로 tier만 변경)
  function moveToTier(id, newTier) {
    const m = movies.find(mv => mv.id === id);
    if (m && m.tier !== newTier) {
      m.tier = newTier;
      render();
    }
  }

  // ===== PC 드래그 앤 드롭 =====
  let dragId = null;

  document.body.addEventListener("dragstart", e => {
    if (e.target.classList.contains("card")) {
      dragId = Number(e.target.dataset.id);
      e.target.classList.add("dragging");
    }
  });
  document.body.addEventListener("dragend", e => {
    if (e.target.classList.contains("card")) e.target.classList.remove("dragging");
  });

  document.querySelectorAll(".tier-drop").forEach(drop => {
    drop.addEventListener("dragover", e => {
      e.preventDefault();
      drop.classList.add("drag-over");
    });
    drop.addEventListener("dragleave", () => drop.classList.remove("drag-over"));
    drop.addEventListener("drop", e => {
      e.preventDefault();
      drop.classList.remove("drag-over");
      moveToTier(dragId, drop.dataset.tier);
    });
  });

  // ===== 모바일 터치 드래그 =====
  let touchGhost = null;
  let touchId = null;

  document.body.addEventListener("touchstart", e => {
    const card = e.target.closest(".card");
    if (!card) return;
    // 삭제 버튼 터치는 드래그 안 함
    if (e.target.classList.contains("del")) return;
    touchId = Number(card.dataset.id);
    const t = e.touches[0];
    // 유령 카드 생성
    touchGhost = card.cloneNode(true);
    touchGhost.classList.add("ghost");
    touchGhost.classList.remove("card");
    document.body.appendChild(touchGhost);
    moveGhost(t.clientX, t.clientY);
    card.classList.add("dragging");
  }, { passive: true });

  document.body.addEventListener("touchmove", e => {
    if (!touchGhost) return;
    e.preventDefault(); // 스크롤 방지
    const t = e.touches[0];
    moveGhost(t.clientX, t.clientY);
    // 현재 손가락 아래의 드롭 영역 표시
    const drop = dropUnder(t.clientX, t.clientY);
    document.querySelectorAll(".tier-drop").forEach(d =>
      d.classList.toggle("drag-over", d === drop));
  }, { passive: false });

  document.body.addEventListener("touchend", e => {
    if (!touchGhost) return;
    const t = e.changedTouches[0];
    const drop = dropUnder(t.clientX, t.clientY);
    document.querySelectorAll(".tier-drop").forEach(d => d.classList.remove("drag-over"));
